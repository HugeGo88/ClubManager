<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'">
  <title>ClubManager</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      background: #f5f7fa;
      color: #242d3b;
      font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-app-region: drag;
    }
    main { display: grid; justify-items: center; gap: 18px; padding: 20px; }
    .brand {
      display: block;
      width: 54px;
      height: 54px;
      border-radius: 14px;
      object-fit: contain;
    }
    .name { font-size: 20px; font-weight: 650; }
    .status { display: flex; align-items: center; gap: 9px; color: #667487; }
    .message { font-size: 13px; color: #667487; text-align: center; min-height: 20px; }
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid #cbd4df;
      border-top-color: #2867c7;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; }
    }
    .error-display {
      display: none;
      text-align: center;
      padding: 16px;
      background: #fef3f2;
      border: 1px solid #fecfc9;
      border-radius: 8px;
      max-width: 350px;
      margin: 0 auto;
    }
    .error-display.show {
      display: block;
    }
    #error-message {
      font-size: 13px;
      color: #c51a1a;
      margin: 0 0 12px 0;
      line-height: 1.4;
    }
    #ok-button {
      display: none;
      padding: 8px 16px;
      background: #c51a1a;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      -webkit-app-region: no-drag;
    }
    #ok-button.show {
      display: block;
    }
    #ok-button:hover {
      background: #a01515;
    }
    #ok-button:focus {
      outline: 2px solid #2867c7;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main>
    <img class="brand" src="../renderer/assets/app-icon.png" alt="" aria-hidden="true">
    <div class="name">ClubManager</div>
    <div class="status" role="status"><span class="spinner" aria-hidden="true"></span>Wird gestartet …</div>
    <div class="message" id="message"></div>
    <div class="error-display" id="error-display">
      <div id="error-message"></div>
      <button id="ok-button">OK</button>
    </div>
  </main>
</body>
</html>
